<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project ReMotion &ndash; Investigation Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-box">
      <div class="spinner"></div>
      <p id="loadingText">Loading case file&hellip;</p>
    </div>
  </div>

  <!-- Persistent Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <img src="../assets/logo/logo.svg" alt="Project ReMotion logo" class="brand-logo">
        <div>
          <h1>Project ReMotion</h1>
          <p class="subtitle">Investigate the failure of an AI-assisted rehabilitation robot.</p>
        </div>
      </div>
      <nav class="main-nav" aria-label="Main navigation">
        <button type="button" class="nav-btn" data-view="dashboard" onclick="navigateTo('dashboard')">Dashboard</button>
        <button type="button" class="nav-btn" data-view="evidence" onclick="navigateTo('evidence')">Evidence</button>
        <button type="button" class="nav-btn" data-view="people" onclick="navigateTo('people')">People &amp; Locations</button>
        <button type="button" class="nav-btn" data-view="timeline" onclick="navigateTo('timeline')">Timeline</button>
        <button type="button" class="nav-btn" data-view="workspace" onclick="navigateTo('workspace')">Workspace</button>
      </nav>
    </div>
  </header>

  <!-- Page Swap Container -->
  <main id="app" class="app-main"></main>

  <!-- Persistent Footer -->
  <footer class="app-footer">
    <p>Project ReMotion Investigation Portal &mdash; Research Center AI, Software and IT-Security of HCW (fictional case study)</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
